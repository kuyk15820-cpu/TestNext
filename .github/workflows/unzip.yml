name: Build UDID Tools

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 1. Install Dependencies & Build Next.js ─────────────
      - name: Install & Build
        run: |
          npm install
          npm run build

      # ── 2. Prepare Output Directory for Artifact ─────────────
      - name: Prepare Final Dist Folder
        run: |
          mkdir -p dist
          # คัดลอกผลลัพธ์ทั้งหมดจากโฟลเดอร์ out ไปยัง dist
          cp -r out/* dist/

      # ── 3. Upload Artifact ──────────────────────────────────
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build-output
          path: dist/
          retention-days: 7
